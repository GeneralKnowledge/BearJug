# The private collector. It accepts evidence from the inventory's sensors on
# one port, never opens a connection to a sensor, and keeps every key on this
# machine: only each sensor's own shipper key and the collector's certificate
# leave it (to the Ansible controller's secrets directory, then the sensor).

- name: Sensors to accept evidence from
  ansible.builtin.set_fact:
    bearjug_sensors: >-
      {{ groups.get('sensors', []) | map('extract', hostvars) | list }}

- name: Required settings
  ansible.builtin.assert:
    quiet: true
    that:
      - ansible_distribution == "Ubuntu" and ansible_distribution_version is version("24.04", ">=")
      - bearjug_admin_cidrs is defined and bearjug_admin_cidrs | length > 0
      - bearjug_sensors | length > 0
      - bearjug_sensors | map(attribute='bearjug_sensor_id') | select('defined') | list | length == bearjug_sensors | length

- name: Sensor addresses (IPv4), as the collector sees them
  ansible.builtin.set_fact:
    bearjug_sensor_addresses: >-
      {{ (bearjug_sensor_addresses | default([])) +
         [hostvars[item].bearjug_sensor_address | default(hostvars[item].ansible_host)] }}
  loop: "{{ groups.get('sensors', []) }}"

- name: Sensor addresses are IPv4 addresses
  ansible.builtin.assert:
    quiet: true
    that: item is match("^([0-9]{1,3}\\.){3}[0-9]{1,3}$")
    fail_msg: "Set bearjug_sensor_address (IPv4) for the sensor at {{ item }}."
  loop: "{{ bearjug_sensor_addresses }}"

- name: Administrative SSH settings
  ansible.builtin.template:
    src: sshd-bearjug.conf.j2
    dest: /etc/ssh/sshd_config.d/10-bearjug.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: bearjug_manage_admin_ssh
  register: bearjug_sshd_conf

- name: Move administrative SSH to port {{ bearjug_admin_ssh_port }}
  ansible.builtin.shell: |
    set -e
    systemctl daemon-reload
    if systemctl is-enabled --quiet ssh.socket 2>/dev/null; then systemctl restart ssh.socket; fi
    systemctl restart ssh.service || true
  when: bearjug_manage_admin_ssh and bearjug_sshd_conf.changed
  changed_when: true

- name: Collector account
  ansible.builtin.user:
    name: bearjug-collector
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: /nonexistent
    password: "!"

- name: Packages
  ansible.builtin.apt:
    name: [nftables, openssl]
    state: present

- name: Data directory
  ansible.builtin.file:
    path: "{{ bearjug_collector_data }}"
    state: directory
    owner: bearjug-collector
    group: bearjug-collector
    mode: "0700"

- name: Initialise the evidence store
  ansible.builtin.command: >-
    runuser -u bearjug-collector -- {{ bearjug_prefix }}/venv/bin/bearjug-collector
    --data {{ bearjug_collector_data }}/store --actor ansible init
  args:
    creates: "{{ bearjug_collector_data }}/store/config.json"

- name: TLS directory
  ansible.builtin.file:
    path: /etc/bearjug/collector
    state: directory
    owner: root
    group: bearjug-collector
    mode: "0750"

# A self-signed certificate for the collector's name; the sensors pin it as
# their CA. Rotating it: delete both files, re-run collector.yml then sensor.yml.
- name: TLS key and certificate
  ansible.builtin.command: >-
    openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes
    -keyout /etc/bearjug/collector/tls.key -out /etc/bearjug/collector/tls.crt
    -days {{ bearjug_collector_tls_days }} -subj /CN={{ bearjug_collector_name }}
    -addext subjectAltName=DNS:{{ bearjug_collector_name }}
  args:
    creates: /etc/bearjug/collector/tls.crt
  notify: Restart collector

- name: TLS file permissions
  ansible.builtin.file:
    path: "/etc/bearjug/collector/{{ item.name }}"
    owner: root
    group: bearjug-collector
    mode: "{{ item.mode }}"
  loop:
    - {name: tls.key, mode: "0640"}
    - {name: tls.crt, mode: "0644"}

- name: Controller secrets directory
  ansible.builtin.file:
    path: "{{ bearjug_secrets_dir }}/sensors"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Collector certificate for the sensors
  ansible.builtin.fetch:
    src: /etc/bearjug/collector/tls.crt
    dest: "{{ bearjug_secrets_dir }}/collector-ca.pem"
    flat: true

- name: Registered sensors
  ansible.builtin.command: >-
    runuser -u bearjug-collector -- {{ bearjug_prefix }}/venv/bin/bearjug-collector
    --data {{ bearjug_collector_data }}/store sensors
  register: bearjug_registered
  changed_when: false

- name: Key hand-off directory (root only)
  ansible.builtin.file:
    path: /root/bearjug-sensor-keys
    state: directory
    owner: root
    group: root
    mode: "0700"

# A sensor is registered once. Its key goes to the controller and is removed
# from the collector; to replace a lost key use replace-sensor-key by hand.
- name: Register new sensors
  ansible.builtin.shell: |
    set -e
    umask 077
    runuser -u bearjug-collector -- {{ bearjug_prefix }}/venv/bin/bearjug-collector \
      --data {{ bearjug_collector_data }}/store --actor ansible \
      add-sensor {{ item }} --key-out {{ bearjug_collector_data }}/{{ item }}.key
    mv {{ bearjug_collector_data }}/{{ item }}.key /root/bearjug-sensor-keys/{{ item }}.key
  loop: "{{ bearjug_sensors | map(attribute='bearjug_sensor_id') | list }}"
  when: item not in (bearjug_registered.stdout_lines | map('split') | map('first') | list)
  register: bearjug_new_sensors

- name: New sensor keys to the controller
  ansible.builtin.fetch:
    src: /root/bearjug-sensor-keys/{{ item.item }}.key
    dest: "{{ bearjug_secrets_dir }}/sensors/{{ item.item }}.key"
    flat: true
  loop: "{{ bearjug_new_sensors.results | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Remove handed-off keys from the collector
  ansible.builtin.file:
    path: /root/bearjug-sensor-keys/{{ item.item }}.key
    state: absent
  loop: "{{ bearjug_new_sensors.results | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Controller key permissions
  ansible.builtin.file:
    path: "{{ bearjug_secrets_dir }}/sensors/{{ item.item }}.key"
    mode: "0600"
  delegate_to: localhost
  become: false
  loop: "{{ bearjug_new_sensors.results | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Firewall rules directory
  ansible.builtin.file:
    path: /etc/bearjug/nftables
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Firewall rules
  ansible.builtin.template:
    src: collector.nft.j2
    dest: /etc/bearjug/nftables/collector.nft
    owner: root
    group: root
    mode: "0600"
    validate: nft -c -f %s
  notify: Reload collector firewall

- name: Units
  ansible.builtin.template:
    src: "systemd/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - bearjug-collector-firewall.service
    - bearjug-collector.service
    - bearjug-collector-purge.service
    - bearjug-collector-purge.timer
  notify: [Reload systemd, Restart collector]

- name: Apply changes
  ansible.builtin.meta: flush_handlers

- name: Services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - bearjug-collector-firewall.service
    - bearjug-collector.service
    - bearjug-collector-purge.timer
