- name: Required settings are present and safe
  ansible.builtin.assert:
    quiet: true
    that:
      - ansible_distribution == "Ubuntu" and ansible_distribution_version is version("24.04", ">=")
      - bearjug_sensor_id is defined and bearjug_sensor_id is match("^[a-z0-9][a-z0-9-]{0,62}$")
      - bearjug_collector_address is defined and bearjug_collector_address is match("^([0-9]{1,3}\.){3}[0-9]{1,3}$")
      - bearjug_admin_cidrs is defined and bearjug_admin_cidrs | length > 0
      - bearjug_admin_ssh_port | int != bearjug_honeypot_port | int
      - bearjug_evidence_backing in ["file", "device"]
      - bearjug_evidence_backing == "file" or bearjug_evidence_device | length > 0
      - bearjug_evidence_size_mib | int >= 256
      - bearjug_sensor_credentials is defined and bearjug_sensor_credentials | length > 0
    fail_msg: >-
      Check bearjug_sensor_id, bearjug_collector_address (IPv4), bearjug_admin_cidrs,
      bearjug_sensor_credentials and the evidence settings (see roles/sensor/defaults/main.yml).

# Same rules as the container's entrypoint, so a bad credential fails here
# rather than as a Cowrie that refuses to start.
- name: Sensor credentials are exact synthetic matches
  ansible.builtin.assert:
    quiet: true
    that:
      - item.username is match("^[a-z_][a-z0-9_.-]{0,31}$")
      - item.password | length >= 1
      - "'*' not in item.password"
      - "':' not in item.password"
      - not item.password.startswith("!")
      - item.password is not match("^/.+/i?$")
      - item.password == item.password.strip()
    fail_msg: >-
      Credential for {{ item.username }}: exact matches only. No '*', ':', leading '!',
      /regex/ or surrounding whitespace in the password.
  loop: "{{ bearjug_sensor_credentials }}"
  loop_control:
    label: "{{ item.username }}"
  no_log: false

- name: The collector's key and certificate for this sensor exist
  ansible.builtin.stat:
    path: "{{ bearjug_secrets_dir }}/{{ item }}"
  delegate_to: localhost
  become: false
  loop:
    - "sensors/{{ bearjug_sensor_id }}.key"
    - collector-ca.pem
  register: bearjug_secret_files

- name: Run collector.yml first
  ansible.builtin.assert:
    quiet: true
    that: bearjug_secret_files.results | map(attribute='stat.exists') | min
    fail_msg: >-
      {{ bearjug_secrets_dir }}/sensors/{{ bearjug_sensor_id }}.key or collector-ca.pem is missing.
      Run collector.yml (with this sensor in the inventory) first.
